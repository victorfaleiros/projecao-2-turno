<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Acessos da projeção</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#262c3a;--fg:#e8ebf2;--mut:#9aa3b5;--flavio:#5ea6f7;--lula:#f28060;--ok:#5fd08a;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f9;--card:#fff;--line:#dde1ea;--fg:#141821;--mut:#5c6578;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.k span{color:var(--mut);font-size:13px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.row{display:grid;grid-template-columns:120px 1fr 72px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flavio)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.n small{color:var(--mut)}
.via{font-weight:600;text-transform:capitalize}
button{font:inherit;background:transparent;color:var(--flavio);border:1.5px solid var(--flavio);border-radius:8px;padding:6px 12px;cursor:pointer}
.foot{color:var(--mut);font-size:13px;margin-top:22px}
.err{color:var(--lula)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Acessos da Projeção do 2º turno</h1>
  <p class="sub">Cada abertura da página conta uma visita. "Aparelhos" é a quantidade de navegadores diferentes (um código aleatório, sem dado pessoal). <button id="bt">Atualizar</button></p>
  <div class="kpis">
    <div class="k"><b id="total">…</b><span>visitas no total</span></div>
    <div class="k"><b id="ap">…</b><span>aparelhos diferentes</span></div>
    <div class="k"><b id="hoje">…</b><span>visitas hoje</span></div>
  </div>
  <h2>De onde vieram</h2>
  <div class="card" id="vias"></div>
  <h2>Dia a dia</h2>
  <div class="card" id="dias"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
const U='https://oumcsjqiuitzosrgnhbr.supabase.co/rest/v1/rpc/simulador_contagem',K='sb_publishable_K-AO_54wSlVX5_iBNuaRAQ_JkCpo_zc';
const f=n=>Number(n).toLocaleString('pt-BR');
const nomeVia={direto:'Link direto',conferencia:'Conferência (ignorar)',instagram:'Instagram',whatsapp:'WhatsApp',x:'X / Twitter',teste:'Teste'};
function linhas(el,itens,chave,rot){const max=Math.max(1,...itens.map(x=>x.n));
  el.innerHTML=itens.length?itens.map(x=>`<div class="row"><div class="${chave==='via'?'via':''}">${rot(x)}</div><div class="bar"><i style="width:${x.n/max*100}%"></i></div><div class="n">${f(x.n)}${x.a!=null?` <small>· ${f(x.a)} ap.</small>`:''}</div></div>`).join(''):'<div class="row">Nenhuma visita ainda.</div>'}
async function carrega(){document.getElementById('foot').textContent='Carregando…';
  try{const r=await fetch(U,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_pagina:new URLSearchParams(location.search).get('pagina')||'projecao-2-turno'})});if(!r.ok)throw new Error(r.status);const d=await r.json();
    total.textContent=f(d.total);ap.textContent=f(d.aparelhos);hoje.textContent=f(d.hoje);
    linhas(vias,d.por_via,'via',x=>nomeVia[x.via]||x.via);
    linhas(dias,[...d.por_dia].reverse(),'dia',x=>{const [a,m,dd]=x.dia.split('-');return `${dd}/${m}`});
    foot.textContent='Atualizado às '+new Date(d.gerado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'. Horário de Brasília.';
  }catch(e){foot.innerHTML='<span class="err">Não consegui ler o contador agora. Tente de novo em instantes.</span>'}}
bt.onclick=carrega;carrega();
</script>
</body>
</html>
